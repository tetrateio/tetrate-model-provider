name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Package only, do not publish
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # A tag that disagrees with package.json would publish the wrong version
      # to the Marketplace, where a version can never be reused.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $manifest"
            exit 1
          fi

      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'

      # Azure DevOps retires global PATs on 2026-12-01. After that VSCE_PAT
      # stops working and this step needs `vsce publish --azure-credential`
      # against a Microsoft Entra ID workload identity instead.
      - name: Publish to the Visual Studio Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --no-dependencies --packagePath *.vsix

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes ./*.vsix
